name: Importar icones de ovos com distancia
on:
  push:
    branches: [otimizar-ovos-label-webp]
permissions:
  contents: write
jobs:
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Instalar conversor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp python3-pil
      - name: Converter e verificar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p items
          tmp=$(mktemp -d)
          for n in 2 5 7 10 12; do
            src="$tmp/OVO${n}km.png"
            dst="items/egg-${n}km-label.webp"
            test ! -e "$dst"
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/heypikachu/go/53aa4b7a4fadb189d969e3648070cd46c65549c3/OVO${n}km.png" -o "$src"
            cwebp -quiet -lossless -exact -m 6 -metadata icc "$src" -o "$dst"
            /usr/bin/python3 - "$src" "$dst" <<'PY'
          import sys, os
          from PIL import Image
          a,b = map(lambda p: Image.open(p).convert('RGBA'), sys.argv[1:])
          assert a.size == b.size and a.tobytes() == b.tobytes(), 'Pixels changed'
          print(f'{sys.argv[2]}: {a.width}x{a.height}, {os.path.getsize(sys.argv[1])} -> {os.path.getsize(sys.argv[2])} bytes, RGBA exact')
          PY
          done
      - name: Publicar apenas os cinco arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add items/egg-{2,5,7,10,12}km-label.webp
          git commit -m "Add lossless egg distance label icons"
          git push origin HEAD:main
